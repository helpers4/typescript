name: Job - Benchmarks

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24"
    outputs:
      status:
        description: "Benchmark execution status"
        value: ${{ jobs.bench.outputs.status }}
      summary:
        description: "Benchmark summary (comma-separated list of benchmarked suites)"
        value: ${{ jobs.bench.outputs.summary }}
      total-suites:
        description: "Total benchmark suites"
        value: ${{ jobs.bench.outputs.total-suites }}

jobs:
  bench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      status: ${{ steps.status.outputs.status }}
      summary: ${{ steps.extract.outputs.summary }}
      total-suites: ${{ steps.extract.outputs.total-suites }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run benchmarks
        id: bench
        run: |
          echo "Running benchmarks with Vitest..."
          pnpm bench 2>&1 | tee bench-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Extract benchmark summary
        id: extract
        if: always()
        run: |
          TOTAL_SUITES=$(grep -c '^ ✓' bench-output.txt || true)
          echo "total-suites=$TOTAL_SUITES" >> $GITHUB_OUTPUT

          # Extract benchmarked suite names
          SUMMARY=$( (grep '^ ✓' bench-output.txt | sed 's/^ ✓ //' | sed 's/ >.*//' | sort -u | tr '\n' ', ' | sed 's/,[[:space:]]*$//') || true )
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Set status
        id: status
        if: always()
        run: |
          if [ "${{ steps.bench.outputs.exit_code }}" == "0" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
