name: Job - Security Audit

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24"
      audit-level:
        required: false
        type: string
        default: "low"
    outputs:
      status:
        description: "Security audit status"
        value: ${{ jobs.security.outputs.status }}

permissions: read-all

jobs:
  security:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.security.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        id: security
        run: |
          echo "Running strict security audit..."
          echo "Audit level: ${{ inputs.audit-level }}"

          # TODO: Remove --ignore-registry-errors once pnpm supports the new bulk advisory endpoint
          # Tracked upstream: https://github.com/pnpm/pnpm/issues/11265
          if pnpm audit --audit-level "${{ inputs.audit-level }}" --ignore-registry-errors; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
