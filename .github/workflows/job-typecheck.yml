name: Job - TypeCheck

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "24"
    outputs:
      status:
        description: "TypeCheck execution status"
        value: ${{ jobs.typecheck.outputs.status }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.typecheck.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        id: typecheck
        run: |
          echo "Running TypeScript type checking..."
          if pnpm run typecheck; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          [ "${{ steps.typecheck.outcome }}" = "success" ] \
            && echo "✅ TypeCheck — passed" >> $GITHUB_STEP_SUMMARY \
            || echo "❌ TypeCheck — failed" >> $GITHUB_STEP_SUMMARY
