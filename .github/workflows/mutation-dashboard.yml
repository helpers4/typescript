name: Mutation Dashboard

on:
  push:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: read

env:
  NODE_LATEST_LTS: "24"

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_LATEST_LTS }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mutation tests with dashboard report
        env:
          CI: "true"
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
          STRYKER_DASHBOARD_VERSION: ${{ github.event.release.tag_name || 'main' }}
        run: pnpm mutation
