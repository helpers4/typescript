name: Post Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Mutation testing — runs on the released code, uploads reports to the GitHub release
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mutation tests
        env:
          GITHUB_STEP_SUMMARY: /dev/null
        run: pnpm mutation:fresh

      - name: Upload mutation reports to release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          tar -czf /tmp/mutation-reports.tar.gz -C reports mutation/
          if gh release view "$TAG" &>/dev/null; then
            gh release upload "$TAG" /tmp/mutation-reports.tar.gz --clobber
            echo "✅ Uploaded mutation reports to release $TAG"
          else
            echo "⚠️ No release found for '$TAG' — skipping upload (manual run on branch)"
          fi

  # Coverage — runs tests with coverage and uploads to Codecov
  coverage:
    uses: ./.github/workflows/job-tests.yml
    with:
      node-version: "24"
      coverage: true
      upload-codecov: true
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}
