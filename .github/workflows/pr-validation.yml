name: Pull Request Validation

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  # Runtime versions — update these when new LTS versions are released
  # ⚠️ These env vars are only available in regular job steps, NOT in reusable workflow with: inputs.
  # Reusable workflow calls (uses:) must use literal values in with: inputs.
  NODE_OLDEST_LTS: "26"
  NODE_LATEST_LTS: "26"
  DENO_LATEST: "2.8.3"
  BUN_LATEST: "latest"

  WORKFLOW_ID: ${{ github.run_id }}
  ARTIFACT_PACKAGE: package-json-${{ github.run_id }}
  ARTIFACT_BUILD: build-${{ github.run_id }}

jobs:
  # Version calculation with artifact upload
  version-calculation:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      version-changed: ${{ steps.version.outputs.changed }}
      status: ${{ steps.version.outputs.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: helpers4/action/setup-pnpm@215739f023134ab5ed2158607074084ec530a830
        with:
          node-version: ${{ env.NODE_LATEST_LTS }}

      - name: Get current version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          echo "changed=false" >> $GITHUB_OUTPUT

  # Build project with artifact upload
  build:
    needs: version-calculation
    uses: ./.github/workflows/job-build.yml
    with:
      node-version: "26"
      upload-artifact: true
      artifact-name: build-${{ github.run_id }}

  # Test job (runs in parallel with build)
  test:
    needs: version-calculation
    uses: ./.github/workflows/job-tests.yml
    with:
      node-version: "26"
      coverage: true

  lint:
    uses: ./.github/workflows/job-lint.yml
    with:
      node-version: "26"

  type-check:
    uses: ./.github/workflows/job-typecheck.yml
    with:
      node-version: "26"

  security:
    uses: ./.github/workflows/job-security.yml
    with:
      node-version: "26"
      audit-level: "low"

  conventional-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check conventional commits
        uses: helpers4/action/conventional-commits@397ddbfecdab62efa1416012576b165abf2d7ee4
        with:
          checkout: "true"
          pr-comment: "error"

  # Runtime compatibility (Node, Deno, Bun)
  runtime-compat:
    needs: version-calculation
    runs-on: ubuntu-latest

    outputs:
      node-status: ${{ steps.test-node.outputs.status }}
      node-version: ${{ steps.test-node.outputs.version }}
      deno-status: ${{ steps.test-deno.outputs.status }}
      deno-version: ${{ steps.test-deno.outputs.version }}
      bun-status: ${{ steps.test-bun.outputs.status }}
      bun-version: ${{ steps.test-bun.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: helpers4/action/setup-pnpm@215739f023134ab5ed2158607074084ec530a830
        with:
          node-version: ${{ env.NODE_LATEST_LTS }}

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: ${{ env.DENO_LATEST }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_LATEST }}

      - name: Test with Node
        id: test-node
        if: always()
        run: |
          echo "version=$(node --version)" >> $GITHUB_OUTPUT
          if npx vitest run; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Test with Deno
        id: test-deno
        if: always()
        run: |
          echo "version=$(deno --version | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT
          if deno run -A ./node_modules/vitest/vitest.mjs run; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Test with Bun
        id: test-bun
        if: always()
        run: |
          echo "version=$(bun --version)" >> $GITHUB_OUTPUT
          if bun run vitest run; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

  # Verification job (depends on build for artifacts)
  verification:
    needs: [build, test]
    uses: ./.github/workflows/job-verification.yml
    with:
      node-version: "26"
      build-artifact: build-${{ github.run_id }}

  # Mutation testing (non-blocking, informational only)
  mutation:
    needs: version-calculation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      status: ${{ steps.mutation.outputs.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: helpers4/action/setup-pnpm@215739f023134ab5ed2158607074084ec530a830
        with:
          node-version: ${{ env.NODE_LATEST_LTS }}

      - name: Run mutation tests
        id: mutation
        run: |
          if pnpm mutation; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

  # Benchmarks (non-blocking, informational only)
  bench:
    needs: version-calculation
    uses: ./.github/workflows/job-bench.yml
    with:
      node-version: "26"
      base-ref: ${{ github.base_ref }}

  # PR comment with results
  pr-comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    needs:
      [
        version-calculation,
        build,
        test,
        lint,
        type-check,
        security,
        conventional-commits,
        verification,
        mutation,
        runtime-compat,
        bench,
      ]
    if: always()

    steps:
      - name: Build extra sections
        id: extra
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const createCoverageSection = (coverage) => {
              const target = 100;
              const getStatus = (value) => {
                const num = parseFloat(value);
                if (num >= target) return { icon: '✅', color: 'brightgreen', label: 'perfect' };
                if (num >= 90) return { icon: '🟢', color: 'green', label: 'excellent' };
                if (num >= 80) return { icon: '🟡', color: 'yellow', label: 'good' };
                if (num >= 60) return { icon: '🟠', color: 'orange', label: 'needs work' };
                return { icon: '🔴', color: 'red', label: 'critical' };
              };

              const createProgressBar = (value) => {
                const pct = parseFloat(value);
                const filled = Math.floor(pct / 5);
                const empty = 20 - filled;
                return '`' + '▓'.repeat(filled) + '░'.repeat(empty) + '`';
              };

              const avgCoverage = (Object.values(coverage).reduce((a, b) => a + parseFloat(b), 0) / 4).toFixed(1);
              const avgStatus = getStatus(avgCoverage);

              const rows = Object.entries(coverage).map(([metric, value]) => {
                const status = getStatus(value);
                const bar = createProgressBar(value);
                return `| ${status.icon} | **${metric}** | ${bar} | **${value}%** |`;
              }).join('\n');

              const header = [
                `> ${avgStatus.icon} **Overall Coverage: ${avgCoverage}%** ${avgStatus.label === 'perfect' ? '— Target reached! 🎯' : '— Target: ' + target + '%'}`,
                '',
                '| | Metric | Progress | Coverage |',
                '|:---:|--------|:--------:|:--------:|',
                rows,
              ].join('\n');

              return header;
            };

            const createMutationSection = (status) => {
              if (status === 'unknown' || status === 'skipped') {
                return '> ⏭️ **Mutation Testing**: skipped';
              }

              const icon = status === 'success' ? '✅' : '❌';
              const label = status === 'success' ? 'passed' : 'failed';

              return [
                `> ${icon} **Mutation Testing** — ${label}`,
                '',
                '> 🧬 *Informational only, does not block the PR*',
              ].join('\n');
            };

            const coverage = {
              'Lines': "${{ needs.test.outputs.coverage-lines || '0' }}",
              'Branches': "${{ needs.test.outputs.coverage-branches || '0' }}",
              'Functions': "${{ needs.test.outputs.coverage-functions || '0' }}",
              'Statements': "${{ needs.test.outputs.coverage-statements || '0' }}",
            };

            const mutationStatus = "${{ needs.mutation.outputs.status || 'unknown' }}";

            const benchStatus = "${{ needs.bench.outputs.status || 'unknown' }}";
            const benchSuites = "${{ needs.bench.outputs.total-suites || '0' }}";

            const runtimes = {
              'Node.js ${{ env.NODE_LATEST_LTS }} (LTS)': { status: "${{ needs.runtime-compat.outputs.node-status || 'unknown' }}", version: "${{ needs.runtime-compat.outputs.node-version || '' }}" },
              'Deno': { status: "${{ needs.runtime-compat.outputs.deno-status || 'unknown' }}", version: "${{ needs.runtime-compat.outputs.deno-version || '' }}" },
              'Bun': { status: "${{ needs.runtime-compat.outputs.bun-status || 'unknown' }}", version: "${{ needs.runtime-compat.outputs.bun-version || '' }}" },
            };

            const createRuntimeSection = (runtimes) => {
              const icons = { 'Node.js ${{ env.NODE_LATEST_LTS }} (LTS)': '🟩', 'Deno': '🦕', 'Bun': '🍞' };
              const rows = Object.entries(runtimes).map(([runtime, { status, version }]) => {
                const icon = status === 'success' ? '✅' : status === 'failure' ? '❌' : '⬜';
                const ver = version ? ` \`${version}\`` : '';
                return `| ${icons[runtime]} | **${runtime}**${ver} | ${icon} |`;
              }).join('\n');

              const statuses = Object.values(runtimes).map(r => r.status);
              const passed = statuses.filter(s => s === 'success').length;
              const total = statuses.length;
              const allOk = passed === total;
              const header = allOk
                ? `> ✅ **Runtime Compatibility: ${passed}/${total}** — All runtimes passed!`
                : `> ⚠️ **Runtime Compatibility: ${passed}/${total}**`;

              return [
                header,
                '',
                '| | Runtime | Status |',
                '|:---:|---------|:------:|',
                rows,
                '',
                '> 🔄 *Runtime compatibility is informational only and does not block the PR*',
              ].join('\n');
            };

            const createBenchSection = (status, suites) => {
              if (status === 'unknown' || status === 'skipped') {
                return '> ⏭️ **Benchmarks**: skipped';
              }

              const icon = status === 'success' ? '✅' : '⚠️';
              const label = status === 'success' ? 'completed' : 'had issues';

              return [
                `> ${icon} **Benchmarks: ${suites} suites** — ${label}`,
                '',
                '> ⏱️ *Benchmarks are informational only and do not block the PR*',
              ].join('\n');
            };

            const extraMarkdown = `### 📊 Code Coverage

            ${createCoverageSection(coverage)}

            ---

            ### 🧬 Mutation Testing

            ${createMutationSection(mutationStatus)}

            ---

            ### 🌐 Runtime Compatibility

            ${createRuntimeSection(runtimes)}

            ---

            ### ⏱️ Benchmarks

            ${createBenchSection(benchStatus, benchSuites)}

            ---

            <details>
            <summary>ℹ️ <b>About this report</b></summary>

            - 🎯 **Coverage Target**: 100% for all metrics
            - 🧬 **Mutation Testing**: powered by [Stryker](https://stryker-mutator.io/) (non-blocking)
            - ⏱️ **Benchmarks**: powered by [Vitest Bench](https://vitest.dev/guide/features.html#benchmarking) (non-blocking)
            - 🔄 This comment updates automatically with each push
            - 📈 Coverage is measured using Vitest + v8

            </details>`;

            core.setOutput('markdown', extraMarkdown);

      - name: Update PR comment
        uses: helpers4/action/pr-status-comment@215739f023134ab5ed2158607074084ec530a830
        with:
          jobs: |
            {
              "🔢 Version": "${{ needs.version-calculation.outputs.status || 'unknown' }}",
              "🏗️ Build": "${{ needs.build.outputs.status || 'unknown' }}",
              "🧪 Tests": "${{ needs.test.outputs.status || 'unknown' }}",
              "📝 Lint": "${{ needs.lint.outputs.status || 'unknown' }}",
              "📘 TypeCheck": "${{ needs.type-check.outputs.status || 'unknown' }}",
              "🔐 Security Audit": "${{ needs.security.outputs.status || 'unknown' }}",
              "🧾 Conventional Commits": "${{ needs.conventional-commits.result }}",
              "🔗 Coherency": "${{ needs.verification.outputs.status || 'unknown' }}"
            }
          extra-markdown: ${{ steps.extra.outputs.markdown }}
