name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (alpha/beta/rc are prerelease variants; resume retries the current version with no bump, for finishing a partially-published release)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - alpha
          - beta
          - rc
          - auto
          - resume
      dry-run:
        description: "Perform a dry-run (no git push, no npm publish)"
        required: false
        default: false
        type: boolean

permissions: read-all

env:
  NODE_VERSION: "26"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Step 1: Repository guard
  repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Security check
        run: |
          if [ "${{ github.repository }}" != "helpers4/typescript" ]; then
            echo "::error::Release workflow can only be executed on helpers4/typescript"
            exit 1
          fi

          RELEASE_TYPE="${{ inputs.release_type }}"
          case "$RELEASE_TYPE" in
            alpha|beta|rc)
              echo "✅ Prerelease type '$RELEASE_TYPE' — allowed from any branch (${{ github.ref }})"
              ;;
            *)
              if [ "${{ github.ref }}" != "refs/heads/main" ]; then
                echo "::error::Stable release types (patch/minor/major/auto/resume) can only be executed on main. Prerelease types (alpha/beta/rc) may run from any branch."
                exit 1
              fi
              ;;
          esac
          echo "✅ Repository ownership verified"

  # Step 2: Lint
  lint:
    needs: repo-guard
    uses: ./.github/workflows/job-lint.yml
    with:
      node-version: "26"

  # Step 3: Type check
  type-check:
    needs: repo-guard
    uses: ./.github/workflows/job-typecheck.yml
    with:
      node-version: "26"

  # Step 4: Tests
  tests:
    needs: repo-guard
    uses: ./.github/workflows/job-tests.yml
    with:
      node-version: "26"
      coverage: true

  # Step 5: Security audit
  security:
    needs: repo-guard
    uses: ./.github/workflows/job-security.yml
    with:
      node-version: "26"
      audit-level: "low"

  # Step 6: Build, bump version and verify
  build-and-verify:
    runs-on: ubuntu-latest
    needs: [lint, type-check, tests, security]
    outputs:
      new-version: ${{ steps.version.outputs.new-version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}

    steps:
      - name: Get GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.PUSHINATOR_ID }}
          private-key: ${{ secrets.PUSHINATOR_KEY }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        id: version
        shell: bash
        run: |
          RELEASE_TYPE="${{ inputs.release_type }}"
          echo "📦 Current version: $(node -p 'require("./package.json").version')"

          case "$RELEASE_TYPE" in
            patch|minor|major)
              pnpm version:${RELEASE_TYPE}
              ;;
            alpha|beta|rc)
              pnpm exec tsx scripts/version/version-manager.ts prerelease --prerelease-id "${RELEASE_TYPE}"
              ;;
            auto)
              pnpm version:auto
              ;;
            resume)
              # No bump: package.json is left exactly as it is. Use this to finish a release
              # that already published some packages and failed on others (e.g. an npm-side
              # permission gap on one package) — re-running with patch/minor/etc. here would
              # recompute a *new* version and publish the remaining packages under a different
              # number than the ones already live, leaving the release split across two
              # versions. `publish:packages` already skips anything already on the registry
              # (see packageVersionExists in scripts/publish/helpers/npm-utils.ts), so this
              # just retries whatever didn't make it the first time, at the same version.
              echo "⏭️  Resuming release at the current version (no bump)"
              ;;
          esac

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Derive npm tag from the resulting version
          if [[ "$NEW_VERSION" == *"-alpha."* ]]; then
            echo "npm-tag=alpha" >> $GITHUB_OUTPUT
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$NEW_VERSION" == *"-beta."* ]]; then
            echo "npm-tag=beta" >> $GITHUB_OUTPUT
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$NEW_VERSION" == *"-rc."* ]]; then
            echo "npm-tag=rc" >> $GITHUB_OUTPUT
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "npm-tag=latest" >> $GITHUB_OUTPUT
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "✅ Version bumped to $NEW_VERSION"

      - name: Inject @since version (stable releases only)
        if: steps.version.outputs.is-prerelease == 'false'
        run: pnpm exec tsx scripts/version/inject-since.ts "${{
          steps.version.outputs.new-version }}"

      - name: Build project
        run: pnpm run build

      - name: Run coherency checks
        run: pnpm coherency

      - name: Upload package.json with new version
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: updated-package
          path: package.json
          retention-days: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-build
          path: build/
          retention-days: 1

      - name: Upload modified helpers (stable releases only)
        if: steps.version.outputs.is-prerelease == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-helpers
          path: helpers/
          retention-days: 1

  # Step 7: Publish release
  publish:
    runs-on: ubuntu-latest
    needs: build-and-verify
    permissions:
      id-token: write
      actions: read
      attestations: write
    outputs:
      new-version: ${{ needs.build-and-verify.outputs.new-version }}

    steps:
      - name: Get GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.PUSHINATOR_ID }}
          private-key: ${{ secrets.PUSHINATOR_KEY }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download updated package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: updated-package
          path: .

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-build
          path: build/

      - name: Download modified helpers (stable releases only)
        if: needs.build-and-verify.outputs.is-prerelease == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-helpers
          path: helpers/

      - name: Get version
        id: version
        run: |
          echo "new-version=${{ needs.build-and-verify.outputs.new-version }}" >> $GITHUB_OUTPUT
          echo "npm-tag=${{ needs.build-and-verify.outputs.npm-tag }}" >> $GITHUB_OUTPUT
          echo "📦 Publishing version ${{ needs.build-and-verify.outputs.new-version }} with tag ${{ needs.build-and-verify.outputs.npm-tag }}"

      - name: Generate changelog
        run: pnpm run changelog -- --tag "v${{ steps.version.outputs.new-version }}"

      - name: Stage version update
        run: |
          git add package.json CHANGELOG.md
          if [ "${{ needs.build-and-verify.outputs.is-prerelease }}" = "false" ]; then
            git add helpers/
          fi

      # Committed through the GitHub API rather than `git commit` + `git push`: GitHub signs
      # API-made commits with the App's identity, which the "verified signatures" rule on main
      # requires (a runner-side git commit is unsigned, and only got through on the bypass).
      - name: Commit and push version update (signed)
        if: ${{ !inputs.dry-run }}
        uses: grafana/github-api-commit-action@b1d81091e8480dd11fcea8bc1f0ab977a0376ca5 # v1.0.0
        with:
          token: ${{ steps.app_token.outputs.token }}
          commit-message: "chore(release): 🔧 bump version to ${{ steps.version.outputs.new-version }}"
          success-if-no-changes: "true"

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: pnpm publish:packages --tag "${{ steps.version.outputs.npm-tag }}"

      - name: Publish to npm (dry-run)
        if: ${{ inputs.dry-run }}
        run: pnpm publish:packages --tag "${{ steps.version.outputs.npm-tag }}"
          --dry-run

      - name: Package build metadata for website
        if: ${{ !inputs.dry-run }}
        run: |
          # Package all meta/ directories plus each category's llms.txt for the website to
          # consume — llms.txt lives at build/<category>/llms.txt, outside meta/, so it needs
          # its own match; without it, generate-typescript-docs.js silently skips regenerating
          # llms-full.txt (warns "not found", never fails the workflow) and the site keeps
          # serving whatever version it last had, indefinitely.
          cd build
          find . \( -path '*/meta/*.json' -o -name 'llms.txt' \) | tar -czf /tmp/build-meta.tar.gz -T -
          echo "📦 Packaged build metadata ($(du -h /tmp/build-meta.tar.gz | cut -f1))"

      - name: Create verified tag and GitHub Release
        if: inputs.dry-run == false
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const version = '${{ steps.version.outputs.new-version }}';
            const isPrerelease = '${{ needs.build-and-verify.outputs.is-prerelease }}' === 'true';
            const tag = `v${version}`;

            // Get the latest commit SHA
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${context.ref.replace('refs/heads/', '')}`
            });

            // Create annotated tag (verified signature via GitHub App)
            const { data: tagObject } = await github.rest.git.createTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
              message: `Release ${tag}`,
              object: ref.object.sha,
              type: 'commit'
            });

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: tagObject.sha
            });

            // Create GitHub Release with auto-generated notes
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
              prerelease: isPrerelease,
              make_latest: isPrerelease ? 'false' : 'true'
            });

            console.log(`✅ Created verified tag and release ${tag}${isPrerelease ? ' (prerelease)' : ''}`);

      - name: Upload build metadata to release
        if: ${{ !inputs.dry-run }}
        run: |
          gh release upload "v${{ steps.version.outputs.new-version }}" \
            /tmp/build-meta.tar.gz \
            --clobber
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Attest release assets
        if: ${{ !inputs.dry-run }}
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '/tmp/build-meta.tar.gz'

      - name: Upload provenance bundle to release
        # OpenSSF Scorecard's Signed-Releases check doesn't read the GitHub
        # Attestations store (see https://github.com/ossf/scorecard/issues/4080) —
        # it only recognizes a release *asset* whose name ends in `.intoto.jsonl`.
        # Re-upload the same Sigstore bundle attest-build-provenance already
        # generated, under that suffix, so both mechanisms point at one artifact.
        if: ${{ !inputs.dry-run }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" /tmp/build-meta.tar.gz.intoto.jsonl
          gh release upload "v${{ steps.version.outputs.new-version }}" \
            /tmp/build-meta.tar.gz.intoto.jsonl \
            --clobber
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Release summary
        run: |
          VERSION="${{ steps.version.outputs.new-version }}"
          TAG="${{ steps.version.outputs.npm-tag }}"
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "⚠️ v${VERSION} (npm: \`${TAG}\`) — DRY-RUN" >> $GITHUB_STEP_SUMMARY
          else
            echo "🚀 v${VERSION} (npm: \`${TAG}\`) — released" >> $GITHUB_STEP_SUMMARY
          fi

  # Step 8: Trigger website docs refresh
  trigger-website-docs:
    runs-on: ubuntu-latest
    needs: [publish]
    if: ${{ !inputs.dry-run }}
    continue-on-error: true
    concurrency:
      group: trigger-website-docs-${{ needs.publish.outputs.new-version }}
      cancel-in-progress: false

    steps:
      - name: Trigger website docs update
        uses: helpers4/action/dispatch-with-fallback@c66ddc3b4c9c46c4c3f4b9a8c87e16bb188321bd
        with:
          target-owner: helpers4
          target-repo: website
          event-type: typescript-release
          payload: '{"version": "${{ needs.publish.outputs.new-version }}"}'
          app-id: ${{ vars.TRIGGANATOR_ID }}
          app-private-key: ${{ secrets.TRIGGANATOR_KEY }}
          fallback-app-id: ${{ vars.PUSHINATOR_ID }}
          fallback-app-private-key: ${{ secrets.PUSHINATOR_KEY }}
