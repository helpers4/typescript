name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (alpha/beta/rc are prerelease variants)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - alpha
          - beta
          - rc
          - auto
      dry-run:
        description: "Perform a dry-run (no git push, no npm publish)"
        required: false
        default: false
        type: boolean

permissions: read-all

env:
  NODE_VERSION: "26"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Step 1: Repository guard
  repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Security check
        run: |
          if [ "${{ github.repository }}" != "helpers4/typescript" ]; then
            echo "::error::Release workflow can only be executed on helpers4/typescript"
            exit 1
          fi

          RELEASE_TYPE="${{ inputs.release_type }}"
          case "$RELEASE_TYPE" in
            alpha|beta|rc)
              echo "✅ Prerelease type '$RELEASE_TYPE' — allowed from any branch (${{ github.ref }})"
              ;;
            *)
              if [ "${{ github.ref }}" != "refs/heads/main" ]; then
                echo "::error::Stable release types (patch/minor/major/auto) can only be executed on main. Prerelease types (alpha/beta/rc) may run from any branch."
                exit 1
              fi
              ;;
          esac
          echo "✅ Repository ownership verified"

  # Step 2: Lint
  lint:
    needs: repo-guard
    uses: ./.github/workflows/job-lint.yml
    with:
      node-version: "26"

  # Step 3: Type check
  type-check:
    needs: repo-guard
    uses: ./.github/workflows/job-typecheck.yml
    with:
      node-version: "26"

  # Step 4: Tests
  tests:
    needs: repo-guard
    uses: ./.github/workflows/job-tests.yml
    with:
      node-version: "26"

  # Step 5: Security audit
  security:
    needs: repo-guard
    uses: ./.github/workflows/job-security.yml
    with:
      node-version: "26"
      audit-level: "low"

  # Step 6: Build, bump version and verify
  build-and-verify:
    runs-on: ubuntu-latest
    needs: [lint, type-check, tests, security]
    outputs:
      new-version: ${{ steps.version.outputs.new-version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}

    steps:
      - name: Get GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUSHINATOR_ID }}
          private-key: ${{ secrets.PUSHINATOR_KEY }}

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        id: version
        shell: bash
        run: |
          RELEASE_TYPE="${{ inputs.release_type }}"
          echo "📦 Current version: $(node -p 'require("./package.json").version')"

          case "$RELEASE_TYPE" in
            patch|minor|major)
              pnpm version:${RELEASE_TYPE}
              ;;
            alpha|beta|rc)
              pnpm exec tsx scripts/version/version-manager.ts prerelease --prerelease-id "${RELEASE_TYPE}"
              ;;
            auto)
              pnpm version:auto
              ;;
          esac

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Derive npm tag from the resulting version
          if [[ "$NEW_VERSION" == *"-alpha."* ]]; then
            echo "npm-tag=alpha" >> $GITHUB_OUTPUT
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$NEW_VERSION" == *"-beta."* ]]; then
            echo "npm-tag=beta" >> $GITHUB_OUTPUT
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$NEW_VERSION" == *"-rc."* ]]; then
            echo "npm-tag=rc" >> $GITHUB_OUTPUT
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "npm-tag=latest" >> $GITHUB_OUTPUT
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "✅ Version bumped to $NEW_VERSION"

      - name: Inject @since version (stable releases only)
        if: steps.version.outputs.is-prerelease == 'false'
        run: pnpm exec tsx scripts/version/inject-since.ts "${{
          steps.version.outputs.new-version }}"

      - name: Build project
        run: pnpm run build

      - name: Run coherency checks
        run: pnpm coherency

      - name: Upload package.json with new version
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: updated-package
          path: package.json
          retention-days: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-build
          path: build/
          retention-days: 1

      - name: Upload modified helpers (stable releases only)
        if: steps.version.outputs.is-prerelease == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-helpers
          path: helpers/
          retention-days: 1

  # Step 7: Publish release
  publish:
    runs-on: ubuntu-latest
    needs: build-and-verify
    permissions:
      id-token: write
      actions: read
      attestations: write
    outputs:
      new-version: ${{ needs.build-and-verify.outputs.new-version }}

    steps:
      - name: Get GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUSHINATOR_ID }}
          private-key: ${{ secrets.PUSHINATOR_KEY }}

      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download updated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: updated-package
          path: .

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-build
          path: build/

      - name: Download modified helpers (stable releases only)
        if: needs.build-and-verify.outputs.is-prerelease == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-helpers
          path: helpers/

      - name: Get version
        id: version
        run: |
          echo "new-version=${{ needs.build-and-verify.outputs.new-version }}" >> $GITHUB_OUTPUT
          echo "npm-tag=${{ needs.build-and-verify.outputs.npm-tag }}" >> $GITHUB_OUTPUT
          echo "📦 Publishing version ${{ needs.build-and-verify.outputs.new-version }} with tag ${{ needs.build-and-verify.outputs.npm-tag }}"

      - name: Generate changelog
        run: pnpm run changelog -- --tag "v${{ steps.version.outputs.new-version }}"

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          if [ "${{ needs.build-and-verify.outputs.is-prerelease }}" = "false" ]; then
            git add helpers/
          fi
          git commit -m "chore(release): 🔧 bump version to ${{ steps.version.outputs.new-version }}" || echo "No changes to commit"

      - name: Push version commit
        if: ${{ !inputs.dry-run }}
        run: git push origin ${{ github.ref }}

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: pnpm publish:packages --tag "${{ steps.version.outputs.npm-tag }}"

      - name: Publish to npm (dry-run)
        if: ${{ inputs.dry-run }}
        run: pnpm publish:packages --tag "${{ steps.version.outputs.npm-tag }}"
          --dry-run

      - name: Package build metadata for website
        if: ${{ !inputs.dry-run }}
        run: |
          # Package all meta/ directories for the website to consume
          cd build
          find . -path '*/meta/*.json' | tar -czf /tmp/build-meta.tar.gz -T -
          echo "📦 Packaged build metadata ($(du -h /tmp/build-meta.tar.gz | cut -f1))"

      - name: Create verified tag and GitHub Release
        if: inputs.dry-run == false
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const version = '${{ steps.version.outputs.new-version }}';
            const isPrerelease = '${{ needs.build-and-verify.outputs.is-prerelease }}' === 'true';
            const tag = `v${version}`;

            // Get the latest commit SHA
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${context.ref.replace('refs/heads/', '')}`
            });

            // Create annotated tag (verified signature via GitHub App)
            const { data: tagObject } = await github.rest.git.createTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
              message: `Release ${tag}`,
              object: ref.object.sha,
              type: 'commit'
            });

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: tagObject.sha
            });

            // Create GitHub Release with auto-generated notes
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
              prerelease: isPrerelease,
              make_latest: isPrerelease ? 'false' : 'true'
            });

            console.log(`✅ Created verified tag and release ${tag}${isPrerelease ? ' (prerelease)' : ''}`);

      - name: Upload build metadata to release
        if: ${{ !inputs.dry-run }}
        run: |
          gh release upload "v${{ steps.version.outputs.new-version }}" \
            /tmp/build-meta.tar.gz \
            --clobber
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Attest release assets
        if: ${{ !inputs.dry-run }}
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: '/tmp/build-meta.tar.gz'

      - name: Upload provenance bundle to release
        # OpenSSF Scorecard's Signed-Releases check doesn't read the GitHub
        # Attestations store (see https://github.com/ossf/scorecard/issues/4080) —
        # it only recognizes a release *asset* whose name ends in `.intoto.jsonl`.
        # Re-upload the same Sigstore bundle attest-build-provenance already
        # generated, under that suffix, so both mechanisms point at one artifact.
        if: ${{ !inputs.dry-run }}
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" /tmp/build-meta.tar.gz.intoto.jsonl
          gh release upload "v${{ steps.version.outputs.new-version }}" \
            /tmp/build-meta.tar.gz.intoto.jsonl \
            --clobber
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Release summary
        run: |
          VERSION="${{ steps.version.outputs.new-version }}"
          TAG="${{ steps.version.outputs.npm-tag }}"
          if [ "${{ inputs.dry-run }}" = "true" ]; then
            echo "⚠️ v${VERSION} (npm: \`${TAG}\`) — DRY-RUN" >> $GITHUB_STEP_SUMMARY
          else
            echo "🚀 v${VERSION} (npm: \`${TAG}\`) — released" >> $GITHUB_STEP_SUMMARY
          fi

  # Step 8: Trigger website docs refresh
  trigger-website-docs:
    runs-on: ubuntu-latest
    needs: [publish]
    if: ${{ !inputs.dry-run }}
    continue-on-error: true
    concurrency:
      group: trigger-website-docs-${{ needs.publish.outputs.new-version }}
      cancel-in-progress: false

    steps:
      - name: Get Trigganator token
        id: trigganator
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.TRIGGANATOR_ID }}
          private-key: ${{ secrets.TRIGGANATOR_KEY }}
          owner: helpers4
          repositories: website
          permission-contents: write

      - name: Trigger website docs update
        id: trigger_docs_primary
        continue-on-error: true
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ steps.trigganator.outputs.token }}
          repository: helpers4/website
          event-type: typescript-release
          client-payload: '{"version": "${{ needs.publish.outputs.new-version }}"}'

      - name: Get Pushinator token fallback
        if: steps.trigger_docs_primary.outcome != 'success'
        id: pushinator_fallback
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUSHINATOR_ID }}
          private-key: ${{ secrets.PUSHINATOR_KEY }}
          owner: helpers4
          repositories: website
          permission-contents: write

      - name: Retry website docs update with fallback token
        if: steps.trigger_docs_primary.outcome != 'success'
        id: trigger_docs_fallback
        continue-on-error: true
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ steps.pushinator_fallback.outputs.token }}
          repository: helpers4/website
          event-type: typescript-release
          client-payload: '{"version": "${{ needs.publish.outputs.new-version }}"}'

      - name: Trigger summary
        run: |
          if [ "${{ steps.trigger_docs_primary.outcome }}" = "success" ] || [ "${{ steps.trigger_docs_fallback.outcome }}" = "success" ]; then
            echo "✅ Website docs trigger dispatched for v${{ needs.publish.outputs.new-version }}"
          else
            echo "⚠️  Website docs trigger failed (non-blocking) for v${{ needs.publish.outputs.new-version }}"
          fi
