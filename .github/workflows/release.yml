name: Release

# Releases helpers4 with helpers4/action-release: after the same gates as a pull request, it
# computes the version from the Conventional Commits, writes it in package.json (the build copies
# it into every package of build/), replaces `@since next` in the helpers, adds the section of the
# version to CHANGELOG.md (a human summary written under `## [Unreleased]` leads it), builds, dry-runs
# `npm publish` for every package, pushes the signed release commit to `main` (as helpers4-bot,
# which bypasses the ruleset), tags it, publishes every package to npm with trusted publishing and
# publishes the GitHub release. The steps after the action attach and attest the build metadata
# that the website reads.
#
# Prereleases (alpha, beta, rc) may run from any branch and keep `@since next`; a stable release
# only runs from main.
#
# Resumable: if a run failed after the release commit, run it again (or `bump: resume`): the action
# publishes only the packages npm does not serve yet, and the steps below finish the release.
#
# Authentication is npm trusted publishing: a short-lived token minted from the GitHub OIDC identity
# of this run, so no secret is stored. Every package has this repository and release.yml as its
# Trusted Publisher on npmjs.com (no environment). A new package must be published once by hand
# before it can have one (see CONTRIBUTING.md).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "bump (alpha, beta and rc are prereleases; resume finishes a release already tagged)"
        type: choice
        default: auto
        options: [auto, patch, minor, major, alpha, beta, rc, resume]
      dry-run:
        description: "dry-run"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: read-all

env:
  NODE_VERSION: "26"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository and branch guard
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ "$GITHUB_REPOSITORY" != "helpers4/typescript" ]; then
            echo "::error::Releases only run from helpers4/typescript (this is $GITHUB_REPOSITORY)."
            exit 1
          fi
          case "$BUMP" in
            alpha|beta|rc) ;;
            *)
              if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "::error::A stable release only runs from main (this is $GITHUB_REF). Prereleases (alpha, beta, rc) and dry-runs may run from any branch."
                exit 1
              fi
              ;;
          esac

  # The same gates as a pull request, on the exact commit that will be released.
  lint:
    needs: guard
    uses: ./.github/workflows/job-lint.yml
    with:
      node-version: "26"

  type-check:
    needs: guard
    uses: ./.github/workflows/job-typecheck.yml
    with:
      node-version: "26"

  tests:
    needs: guard
    uses: ./.github/workflows/job-tests.yml
    with:
      node-version: "26"
      coverage: true

  security:
    needs: guard
    uses: ./.github/workflows/job-security.yml
    with:
      node-version: "26"
      audit-level: "low"

  release:
    needs: [guard, lint, type-check, tests, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release commit, the tag, the GitHub release
      id-token: write # trusted publishing and build provenance
      attestations: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The build writes build/<package>/ for every category, the presets and the bundles, each with
      # the version of the root package.json; the coherency checks run on that build, before
      # anything is written or published.
      - name: Release
        id: release
        uses: helpers4/action-release@PIN
        with:
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}
          version-files: package.json
          since-files: helpers/*/*.ts
          app-id: ${{ vars.HELPERS4_BOT_ID }}
          app-key: ${{ secrets.HELPERS4_BOT_KEY }}
          targets: |
            - npm: build/*
              build: pnpm run build && pnpm coherency

      # The website reads the meta/*.json and llms.txt of every package of the release.
      - name: Package build metadata for website
        if: ${{ !inputs.dry-run }}
        run: |
          cd build
          find . \( -path '*/meta/*.json' -o -name 'llms.txt' \) | tar -czf /tmp/build-meta.tar.gz -T -
          echo "Packaged build metadata ($(du -h /tmp/build-meta.tar.gz | cut -f1))"

      - name: Attest the build metadata
        id: attest
        if: ${{ !inputs.dry-run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/build-meta.tar.gz

      # OpenSSF Scorecard's Signed-Releases check does not read the GitHub attestation store
      # (https://github.com/ossf/scorecard/issues/4080): it only recognizes a release asset whose
      # name ends in `.intoto.jsonl`. The same Sigstore bundle is attached under that suffix.
      - name: Attach the metadata and its provenance to the release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" /tmp/build-meta.tar.gz.intoto.jsonl
          gh release upload "$TAG" /tmp/build-meta.tar.gz /tmp/build-meta.tar.gz.intoto.jsonl --clobber

  # Tells the website to regenerate its docs from this release. Best-effort: a failure here never
  # fails the release; run it on the website by hand with the version instead.
  trigger-website-docs:
    needs: release
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: trigger-website-docs-${{ needs.release.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: Trigger website docs update
        uses: helpers4/action/dispatch-with-fallback@c66ddc3b4c9c46c4c3f4b9a8c87e16bb188321bd
        with:
          target-owner: helpers4
          target-repo: website
          event-type: typescript-release
          payload: '{"version": "${{ needs.release.outputs.version }}"}'
          app-id: ${{ vars.TRIGGANATOR_ID }}
          app-private-key: ${{ secrets.TRIGGANATOR_KEY }}
          fallback-app-id: ${{ vars.PUSHINATOR_ID }}
          fallback-app-private-key: ${{ secrets.PUSHINATOR_KEY }}
