name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (alpha/beta/rc are prerelease variants)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - alpha
          - beta
          - rc
          - auto
      dry-run:
        description: "Perform a dry-run (no git push, no npm publish)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Step 1: Repository guard
  repo-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Security check
        run: |
          if [ "${{ github.repository }}" != "helpers4/typescript" ]; then
            echo "::error::Release workflow can only be executed on helpers4/typescript"
            exit 1
          fi
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Release workflow can only be executed on main"
            exit 1
          fi
          echo "✅ Repository ownership verified"

  # Step 2: Lint
  lint:
    needs: repo-guard
    uses: ./.github/workflows/job-lint.yml
    with:
      node-version: "24"

  # Step 3: Type check
  type-check:
    needs: repo-guard
    uses: ./.github/workflows/job-typecheck.yml
    with:
      node-version: "24"

  # Step 4: Tests
  tests:
    needs: repo-guard
    uses: ./.github/workflows/job-tests.yml
    with:
      node-version: "24"

  # Step 5: Security audit
  security:
    needs: repo-guard
    uses: ./.github/workflows/job-security.yml
    with:
      node-version: "24"
      audit-level: "low"

  # Step 6: Mutation testing (quality gate, no dashboard reporting)
  mutation:
    needs: repo-guard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mutation tests
        env:
          # Prevent vitest from flooding the step summary with one report per mutant
          GITHUB_STEP_SUMMARY: /dev/null
        run: pnpm mutation

      - name: Mutation summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const f = 'reports/mutation/mutation.json';
            if (!fs.existsSync(f)) process.exit(0);
            const report = JSON.parse(fs.readFileSync(f, 'utf8'));
            const mutants = Object.values(report.files).flatMap(f => f.mutants);
            const killed = mutants.filter(m => ['Killed','Timeout'].includes(m.status)).length;
            const total  = mutants.filter(m => ['Killed','Survived','Timeout','NoCoverage'].includes(m.status)).length;
            const score  = total ? (killed / total * 100) : 0;
            const t = { break: 60, high: 90, low: 70, ...report.thresholds };
            const icon = score >= t.high ? '\u2705' : score >= t.low ? '\u26a0\ufe0f' : '\u274c';
            const line = \`## Mutation tests\n\n\${icon} Score: \${score.toFixed(2)}% (\${killed}/\${total})\n\`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, line);
          "

  # Step 7: Build, bump version and verify
  build-and-verify:
    runs-on: ubuntu-latest
    needs: [ lint, type-check, tests, security, mutation ]
    outputs:
      new-version: ${{ steps.version.outputs.new-version }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}

    steps:
      - name: Get GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PUSHINATOR_ID }}
          private-key: ${{ secrets.PUSHINATOR_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        id: version
        shell: bash
        run: |
          RELEASE_TYPE="${{ inputs.release_type }}"
          echo "📦 Current version: $(node -p 'require("./package.json").version')"

          case "$RELEASE_TYPE" in
            patch|minor|major)
              pnpm version:${RELEASE_TYPE}
              ;;
            alpha|beta|rc)
              pnpm exec tsx scripts/version/version-manager.ts prerelease --prerelease-id "${RELEASE_TYPE}"
              ;;
            auto)
              pnpm version:auto
              ;;
          esac

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Derive npm tag from the resulting version
          if [[ "$NEW_VERSION" == *"-alpha."* ]]; then
            echo "npm-tag=alpha" >> $GITHUB_OUTPUT
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$NEW_VERSION" == *"-beta."* ]]; then
            echo "npm-tag=beta" >> $GITHUB_OUTPUT
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "$NEW_VERSION" == *"-rc."* ]]; then
            echo "npm-tag=rc" >> $GITHUB_OUTPUT
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "npm-tag=latest" >> $GITHUB_OUTPUT
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
          fi

          echo "✅ Version bumped to $NEW_VERSION"

      - name: Build project
        run: pnpm run build

      - name: Run coherency checks
        run: pnpm coherency

      - name: Upload package.json with new version
        uses: actions/upload-artifact@v7
        with:
          name: updated-package
          path: package.json
          retention-days: 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: build/
          retention-days: 1

  # Step 8: Publish release
  publish:
    runs-on: ubuntu-latest
    needs: build-and-verify

    steps:
      - name: Get GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PUSHINATOR_ID }}
          private-key: ${{ secrets.PUSHINATOR_KEY }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download updated package
        uses: actions/download-artifact@v8
        with:
          name: updated-package
          path: .

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-build
          path: build/

      - name: Get version
        id: version
        run: |
          echo "new-version=${{ needs.build-and-verify.outputs.new-version }}" >> $GITHUB_OUTPUT
          echo "npm-tag=${{ needs.build-and-verify.outputs.npm-tag }}" >> $GITHUB_OUTPUT
          echo "📦 Publishing version ${{ needs.build-and-verify.outputs.new-version }} with tag ${{ needs.build-and-verify.outputs.npm-tag }}"

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): 🔧 bump version to ${{ steps.version.outputs.new-version }}" || echo "No changes to commit"

      - name: Push version commit
        if: ${{ !inputs.dry-run }}
        run: git push origin ${{ github.ref }}

      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: pnpm publish:packages --tag "${{ steps.version.outputs.npm-tag }}"

      - name: Publish to npm (dry-run)
        if: ${{ inputs.dry-run }}
        run: pnpm publish:packages --tag "${{ steps.version.outputs.npm-tag }}"
          --dry-run

      - name: Package build metadata for website
        if: ${{ !inputs.dry-run }}
        run: |
          # Package all meta/ directories for the website to consume
          cd build
          find . -path '*/meta/*.json' | tar -czf /tmp/build-meta.tar.gz -T -
          echo "📦 Packaged build metadata ($(du -h /tmp/build-meta.tar.gz | cut -f1))"

      - name: Create verified tag and GitHub Release
        if: inputs.dry-run == false
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const version = '${{ steps.version.outputs.new-version }}';
            const isPrerelease = '${{ needs.build-and-verify.outputs.is-prerelease }}' === 'true';
            const tag = `v${version}`;

            // Get the latest commit SHA
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${context.ref.replace('refs/heads/', '')}`
            });

            // Create annotated tag (verified signature via GitHub App)
            const { data: tagObject } = await github.rest.git.createTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
              message: `Release ${tag}`,
              object: ref.object.sha,
              type: 'commit'
            });

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: tagObject.sha
            });

            // Create GitHub Release with auto-generated notes
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
              prerelease: isPrerelease,
              make_latest: isPrerelease ? 'false' : 'true'
            });

            console.log(`✅ Created verified tag and release ${tag}${isPrerelease ? ' (prerelease)' : ''}`);

      - name: Upload build metadata to release
        if: ${{ !inputs.dry-run }}
        run: |
          gh release upload "v${{ steps.version.outputs.new-version }}" \
            /tmp/build-meta.tar.gz \
            --clobber
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}

      - name: Get Trigganator token
        id: trigganator
        if: ${{ !inputs.dry-run }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TRIGGANATOR_ID }}
          private-key: ${{ secrets.TRIGGANATOR_KEY }}
          owner: helpers4
          repositories: website

      - name: Trigger documentation update
        id: trigger_docs
        if: ${{ !inputs.dry-run }}
        continue-on-error: true
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.trigganator.outputs.token }}
          repository: helpers4/website
          event-type: typescript-release
          client-payload: "{\"version\": \"${{ steps.version.outputs.new-version }}\"}"

      - name: Release summary
        run: |
          echo "✅ Release completed successfully!"
          echo "📦 Version: ${{ steps.version.outputs.new-version }}"
          echo "🏷️  NPM tag: ${{ steps.version.outputs.npm-tag }}"
          if [ "${{ steps.trigger_docs.outcome }}" = "success" ]; then
            echo "📚 Documentation update triggered"
          else
            echo "⚠️  Documentation update trigger failed (non-blocking)"
          fi

      - name: Dry-run summary
        if: ${{ inputs.dry-run }}
        run: echo "⚠️  This was a DRY-RUN - no changes were published"
